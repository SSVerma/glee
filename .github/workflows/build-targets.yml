name: Build and Release Targets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  desktop:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Desktop Installer
        shell: bash
        run: |
          chmod +x ./gradlew
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            ./gradlew :shared:packageReleaseDmg
            mkdir -p staging && cp shared/build/compose/binaries/main-release/dmg/*.dmg staging/glee.dmg
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            ./gradlew :shared:packageReleaseMsi
            mkdir -p staging && cp shared/build/compose/binaries/main-release/msi/*.msi staging/glee.msi
          else
            ./gradlew :shared:packageReleaseDeb
            mkdir -p staging && cp shared/build/compose/binaries/main-release/deb/*.deb staging/glee.deb
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: staging/glee.*

  web:
    name: Web Build (WASM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Web
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:wasmJsBrowserDistribution

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: shared/build/dist/wasmJs/productionExecutable

  release:
    name: GitHub Release
    needs: [ desktop, web ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create Release Tag
        id: tag
        run: echo "tag=v$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.msi
            release-artifacts/**/*.deb
